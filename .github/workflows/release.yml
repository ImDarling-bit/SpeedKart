# Construit le lanceur Windows et le publie dans les releases GitHub quand un tag vX.Y.Z est poussé.
# Les lanceurs déjà installés se mettent à jour tout seuls à partir de ces releases.
name: Lanceur Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Le tag correspond à la version du package
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME différent de la version $version du package.json"
            exit 1
          fi

      - run: npm ci

      - name: Circuits et partie simulés
        run: npm run simulate

      # La release est créée d'avance en brouillon : sinon electron-builder envoie ses fichiers
      # en parallèle et chaque envoi crée sa propre release (deux « v1.0.0 » à moitié remplies).
      - name: Release en brouillon
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et envoi
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de la release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
